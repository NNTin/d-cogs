<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Sequence Diagram – Detailed Errors</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px 24px;
      max-width: 1200px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      color: #f8fafc;
    }

    p {
      margin: 0 0 18px;
      color: #cbd5e1;
    }

    .mermaid-container {
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      overflow-x: auto;
    }

    pre.error {
      color: #f87171;
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      margin: 0;
      font-size: 14px;
    }
  </style>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

    mermaid.initialize({
      startOnLoad: false,   // IMPORTANT
      theme: "dark",
      securityLevel: "strict",
      logLevel: "debug"
    });

    const diagramText = `
sequenceDiagram
  participant Alice
  participant Bob

  Alice->>Bob: Did you hear about the weather?
  Bob->>Alice: It's sunny now.

  causing intentional syntax error here to test error handling
`;

    window.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("diagram");

      try {
        // This throws detailed parse errors
        await mermaid.parse(diagramText);

        const { svg } = await mermaid.render("diagram1", diagramText);
        container.innerHTML = svg;
      } catch (err) {
        console.error(err);

        container.innerHTML = `
          <pre class="error">${err.message}</pre>
        `;
      }
    });
  </script>
</head>

<body>
  <main class="card">
    <h1>Hybrid Architecture Flow</h1>
    <p>Sequence diagram rendered with Mermaid (detailed error reporting).</p>

    <div id="diagram" class="mermaid-container"></div>
  </main>
</body>
</html>
